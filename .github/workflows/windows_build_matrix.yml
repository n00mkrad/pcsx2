name: 🖥️ Windows Builds

# parallel-GS branch: only the release configuration (CMake + MSVC) is built.
# The MSBuild project files are not kept in sync by the parallel-GS patches.

on:
  push:
    branches-ignore:
      - "l10n_master"
  pull_request:
    branches:
      - master

jobs:
  build_qt_deps:
    name: "Dependencies"
    uses: ./.github/workflows/windows_deps_build.yml

  build_qt_cmake:
    needs: build_qt_deps
    name: "CMake"
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "CMake MSVC"
      artifactPrefixName: "PCSX2-windows-Qt-x64-parallel-gs"
      configuration: CMake
      buildSystem: cmake
    secrets: inherit
